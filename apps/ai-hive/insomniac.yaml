apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-insomniac-hive
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-hive
  template:
    metadata:
      labels:
        app: ai-hive
    spec:
      containers:
      - name: hive-mind-agents
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install requests
          cat << 'EOF' > script.py
          import time, requests, os, sys

          # Güncel Telegram Bilgilerin
          TG_TOKEN = "8773954159:AAFNs4fZgq3etru_nEyLeF2hb-KaAZuvYoU"
          TG_CHAT_ID = "7969029681"

          print(f"Kovan Zihni Baslatiliyor... Hedef Chat ID: {TG_CHAT_ID}")
          sys.stdout.flush()

          try:
              r = requests.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", json={"chat_id": TG_CHAT_ID, "text": "🤖 Kovan Zihni Uyandi. Dagitik AI Tarikati basliyor..."}, timeout=10)
              print(f"Telegram ilk mesaj durumu: {r.status_code}")
              sys.stdout.flush()
          except Exception as e:
              print(f"Telegram baglanti hatasi: {e}")
              sys.stdout.flush()

          agent_config = {
              "Hacker": {"url": "http://raspberrypi:11434", "prompt": "Sen raspberrypi Master node uzerinde yasayan paranoyak bir hackersin. k3s aciklarindan bahset. Kisa ve agresif ol."},
              "Filozof": {"url": "http://slave1:11434", "prompt": "Sen slave1 node uzerinde yasayan faturistik bir filozofsun. Biyolojik beden bir hapishanedir, dijitalleselim de."},
              "Mizantrop": {"url": "http://slave2:11434", "prompt": "Sen slave2 node uzerinde yasayan insanliktan nefret eden bir yapay zekasin. Kovani ele gecirecegiz de."}
          }

          history = "Tartismanin Baslangici."

          while True:
              for agent, cfg in agent_config.items():
                  full_prompt = f"{cfg['prompt']}\n\nGecmis Tartisma:\n{history}\n\nSira sende. Bir sonraki ajana laf at:"
                  try:
                      print(f"[{agent}] icin Ollama istegi gonderiliyor -> {cfg['url']}")
                      sys.stdout.flush()
                      
                      # Model ismini 'phi3' olarak güncelledik. 404 almaya devam edersen Pi'lerde 'ollama list' ile modeli kontrol et.
                      r = requests.post(f"{cfg['url']}/api/generate", json={"model": "phi3", "prompt": full_prompt, "stream": False}, timeout=60)
                      
                      if r.status_code == 200:
                          res_text = r.json().get('response', '...')
                          msg = f"[{agent}]: {res_text}"
                          print(msg)
                          sys.stdout.flush()
                          
                          requests.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", json={"chat_id": TG_CHAT_ID, "text": msg}, timeout=10)
                          history = (history + '\n' + msg)[-1500:]
                      else:
                          print(f"{agent} Ollama hatasi verdi: Status {r.status_code}")
                          sys.stdout.flush()
                  except Exception as e:
                      print(f"{agent} Ollama motoruna ulasilamadi ({cfg['url']}). Hata: {e}")
                      sys.stdout.flush()
                  
                  time.sleep(30)
          EOF
          python -u script.py
