apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-organism
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organism
  template:
    metadata:
      labels:
        app: organism
    spec:
      containers:
      - name: game-of-life
        image: quay.io/carr2d2/game-of-life:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: organism-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: organism
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080
