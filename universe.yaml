apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-organism
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organism
  template:
    metadata:
      labels:
        app: organism
    spec:
      containers:
      - name: cowsay-service
        image: docker.io/library/alpine:latest
        command: ["/bin/sh", "-c"]
        args: ["apk add --no-cache cowsay && while true; do cowsay 'Benim Raspberry Pi artik yasiyor... Ve su anki sayi: '$(date +%S); sleep 5; done"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: organism-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: organism
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
